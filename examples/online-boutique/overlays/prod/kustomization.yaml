# The production tier. It is placed `dedicated`, so it owns its Fabric — the cluster this
# overlay lands on exists because THIS environment brought it into being.
#
# The namespace here must match the namespace the environment declares in Alethia. A mismatch is
# refused by the tenant AppProject (`tenant-<project>-<namespace>`) rather than deployed into the
# wrong place, so these two are one setting in two files.
# NO namespace.yaml here, deliberately. Alethia creates the destination namespace for every
# placement mode — `dedicated` and `vcluster` Applications carry CreateNamespace=true, and a
# `namespace` placement has already created a HARDENED one before the Application exists, which
# is why its Application sets CreateNamespace=false and its tenant AppProject ships
# `clusterResourceWhitelist: []`. An overlay that declares its own Namespace is refused there
# ("one or more synchronization tasks are not valid") — and rightly: a tenant that can create
# cluster-scoped objects is not a tenant. The `namespace:` field below still stamps every
# resource into the right place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-prod
resources:
  - ../../base
patches:
  # Production carries redundancy the cheaper tiers do not.
  - target: { kind: Deployment, name: frontend }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: cartservice }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # No synthetic load in production — it would be indistinguishable from real traffic in every
  # dashboard the demo then shows.
  - target: { kind: Deployment, name: loadgenerator }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
